<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download YouTube videos as high-quality 320kbps MP3 audio files. Fast, free, and easy to use.">
    <title>YT MP3 — YouTube to 320kbps MP3 Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Animated background orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <main class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
                        <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <h1>YT <span class="accent">MP3</span></h1>
            </div>
            <p class="tagline">Convert YouTube videos to high-quality <strong>320kbps MP3</strong></p>
        </header>

        <!-- URL Input Card -->
        <div class="card input-card">
            <div class="input-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input
                        type="url"
                        id="urlInput"
                        placeholder="Paste YouTube URL here..."
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button id="pasteBtn" class="btn-paste" title="Paste from clipboard">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
                <button id="fetchBtn" class="btn btn-primary">
                    <span class="btn-text">Get Info</span>
                    <div class="btn-loader"></div>
                </button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorBox" class="error-box hidden">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="errorText"></span>
        </div>

        <!-- Video Info Card -->
        <div id="infoCard" class="card info-card hidden">
            <div class="info-layout">
                <div class="thumbnail-wrapper">
                    <img id="thumbnail" src="" alt="Video thumbnail">
                    <div class="duration-badge" id="duration"></div>
                </div>
                <div class="info-details">
                    <h2 id="videoTitle" class="video-title"></h2>
                    <p id="channelName" class="channel-name"></p>
                    <div class="meta-row">
                        <span class="meta-chip">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.5"/>
                                <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            320kbps MP3
                        </span>
                        <span class="meta-chip" id="viewCount">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            <span id="views"></span>
                        </span>
                    </div>
                    <button id="downloadBtn" class="btn btn-download">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span class="btn-text">Download MP3</span>
                        <div class="btn-loader"></div>
                    </button>
                </div>
            </div>

            <!-- Download Progress -->
            <div id="progressSection" class="progress-section hidden">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">Downloading and converting...</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Built with <span class="heart">♥</span> using yt-dlp & Flask</p>
            <p class="disclaimer">For personal use only. Respect copyright laws.</p>
        </footer>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
